apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: taskflow-deployer
  namespace: taskflow
rules:
  - apiGroups: ["apps"]
    resources:
      - deployments
    verbs:
      - get
      - list
      - watch
      - patch
      - update

  - apiGroups: ["apps"]
    resources:
      - deployments/status
    verbs:
      - get

  - apiGroups: [""]
    resources:
      - pods
    verbs:
      - get
      - list
      - watch

  - apiGroups: [""]
    resources:
      - pods/portforward
    verbs:
      - create

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: taskflow-deployer-binding
  namespace: taskflow
subjects:
  - kind: Group
    name: taskflow-deployers
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: taskflow-deployer
  apiGroup: rbac.authorization.k8s.io