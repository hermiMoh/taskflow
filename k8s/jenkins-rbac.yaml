apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins-deployer
  namespace: taskflow
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: taskflow-deployer-role
  namespace: taskflow
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "patch", "update"]

  - apiGroups: ["apps"]
    resources: ["deployments/status"]
    verbs: ["get", "list", "watch"]

  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]

  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list"]

  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: taskflow-deployer-binding
  namespace: taskflow
subjects:
  - kind: ServiceAccount
    name: jenkins-deployer
    namespace: taskflow
roleRef:
  kind: Role
  name: taskflow-deployer-role
  apiGroup: rbac.authorization.k8s.io